short_bio: >-
  <p>
    I am Professor of Artificial Intelligence at
    <a href="https://www.gisma.com/faculty-and-team/prof-dr-mahmoudreza-babaei" target="_blank">GISMA University of Applied Sciences</a>
    in Berlin and Potsdam. I direct BRAINS, the Brandenburg Research Center for Applied Intelligent Systems,
    and lead the Data Science, AI &amp; Digital Business programme. From September to December 2026 I am a
    visiting researcher at the
    <a href="https://www.mpi-sp.org" target="_blank">Max Planck Institute for Security and Privacy</a>
    in Bochum, working with Prof. Meeyoung Cha.
  </p>
  <p>
    I study how algorithms shape what people see and decide online, and how to make those systems fairer.
    It started with news. During my PhD at the
    <a href="https://www.mpi-sws.org" target="_blank">Max Planck Institute for Software Systems</a>
    with Prof. Krishna P. Gummadi, I measured how efficiently people choose their information sources on Twitter,
    how well they can tell true stories from false ones, and which posts readers on both sides of politics can agree on.
  </p>
  <p>
    That work led me to fairness on social networks. If you seed a campaign with a few well-connected people,
    standard influence maximization reaches the majority group first and leaves smaller groups behind.
    With my collaborators I build methods that make fair reach part of the objective itself, first with greedy
    algorithms and now with graph neural networks and deep reinforcement learning.
  </p>
  <p>
    Lately I have been asking how people and machines cooperate. As a postdoc with Prof. Iyad Rahwan at the
    Center for Humans &amp; Machines, I ran online experiments where humans and bots play social dilemmas on
    networks that rewire as the game goes on. My group now puts LLM agents into the same games to see when they
    cooperate and who they choose to link to. We also test whether LLMs used for fact-checking treat political
    claims evenly.
  </p>
  <p>
    Students looking for a thesis project and researchers interested in working together are always welcome to get in touch.
  </p>

