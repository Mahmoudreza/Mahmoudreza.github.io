<style>
.org-badge { width: 52px; height: 52px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.1; flex-shrink: 0; }
.position-text { font-size: 0.95rem; color: #444; margin-top: 2px; }
.org-date { white-space: nowrap; font-size: 0.9rem; font-style: italic; color: #6c757d; padding-left: 1rem; }
.profile-card-name small { font-size: 60%; color: #666; }
</style>
<div id="experience" class="row mt-3">
  <div class="col-12">
    <div class="card border-0 shadow-sm bg-white">
      <div class="card-body p-4">
        {% if site.data.profile.experience %}
          <h6>Experience</h6>
          <ul class="list-unstyled mb-0">
            {% for item in site.data.profile.experience %}
              <li class="media mb-3">
                <div class="org-badge mr-3 mt-1" style="background-color: {{ item.color | default: '#495057' }};">{{ item.abbr }}</div>
                <div class="media-body">
                  <div class="d-flex justify-content-between align-items-start">
                    <div class="font-weight-bold">{{ item.name }}</div>
                    {% if item.date %}<div class="org-date">{{ item.date }}</div>{% endif %}
                  </div>
                  {% if item.position %}<div class="position-text">{{ item.position }}</div>{% endif %}
                </div>
              </li>
            {% endfor %}
          </ul>
        {% endif %}
      </div>
    </div>
  </div>
</div>
